[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lymph-node-metastasis-engine"
version = "2.0.0"
description = "LymphSentinel: Autonomous Sentinel Node Micrometastasis & ITC Detector"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
lymph-node-metastasis-engine = "lymph_node_metastasis_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/lymph-node-metastasis-engine"
Repository = "https://github.com/abusuraihsakhri/lymph-node-metastasis-engine.git"
