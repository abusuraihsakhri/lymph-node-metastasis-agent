name: Test and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: ci-only-deterministic-audit-test-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile Python
        run: python -m compileall -q agents lymph_node_metastasis_agent cli.py lymph_sentinel.py enrichment.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run static-browser tests
        run: |
          node --check web/app.js
          node --test web/app.test.cjs
